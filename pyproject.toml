[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mqtt-broker"
version = "0.1.0"
description = "MQTT broker with a PySide6 desktop GUI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "amqtt==0.12.1",
    "PySide6>=6.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "paho-mqtt>=2.0",
    "ruff>=0.17",
    "pyright>=1.1.400",
]

[project.scripts]
mqtt-broker = "mqtt_broker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mqtt_broker.gui" = ["*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
