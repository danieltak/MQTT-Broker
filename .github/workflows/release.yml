name: Release

# Manual only. The deploy job waits for approval on the "release" environment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare version
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          package_version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/mqtt_broker/__init__.py').read()).group(1))")
          if [ "$version" != "$package_version" ]; then
            echo "::error::pyproject.toml ($version) and mqtt_broker.__version__ ($package_version) differ"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump the version in pyproject.toml and src/mqtt_broker/__init__.py"
            exit 1
          fi
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (previous: ${previous_tag:-none})"

  changelog:
    name: Changelog (Copilot agent review)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      HAS_COPILOT: ${{ secrets.COPILOT_PAT != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect changes since previous release
        run: |
          mkdir -p changes
          if [ -n "$PREVIOUS_TAG" ]; then
            range="$PREVIOUS_TAG..HEAD"
            base="$PREVIOUS_TAG"
          else
            range="HEAD"
            base=$(git hash-object -t tree /dev/null)
          fi
          git log --no-merges --format='- %s (%h)' "$range" > changes/commits.txt
          git diff --stat "$base" HEAD > changes/diffstat.txt
          git diff "$base" HEAD > changes/full.diff
          # Keep the prompt within CLI argument limits
          head -c 60000 changes/full.diff > changes/diff.txt

      - uses: actions/setup-node@v6
        if: env.HAS_COPILOT == 'true'
        with:
          node-version: 24

      - name: Install Copilot CLI
        if: env.HAS_COPILOT == 'true'
        run: npm install -g @github/copilot@1

      - name: Review changes with Copilot agent
        id: ai
        if: env.HAS_COPILOT == 'true'
        continue-on-error: true
        uses: actions/ai-inference@v3
        with:
          prompt-file: .github/prompts/changelog.prompt.yml
          input: |
            version: ${{ needs.prepare.outputs.tag }}
            previous: ${{ needs.prepare.outputs.previous_tag || 'none (first release)' }}
          file_input: |
            commits: changes/commits.txt
            diffstat: changes/diffstat.txt
            diff: changes/diff.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Compose CHANGELOG.md
        env:
          AI_OUTCOME: ${{ steps.ai.outcome }}
          AI_FILE: ${{ steps.ai.outputs.response-file }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$AI_OUTCOME" = "success" ] && [ -s "$AI_FILE" ]; then
            ai=true
            note="Changelog generated by a GitHub Copilot agent review of the changes."
          else
            ai=false
            note="Changelog generated from commit messages (Copilot agent review unavailable)."
            echo "::warning::$note"
          fi
          {
            echo "## MQTT Broker $TAG"
            echo
            if [ "$ai" = true ]; then
              cat "$AI_FILE"
            else
              echo "### Changes"
              cat changes/commits.txt
            fi
            echo
            echo "---"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Full diff:** https://github.com/$REPO/compare/$PREVIOUS_TAG...$TAG"
              echo
            fi
            echo "_${note}_"
          } > CHANGELOG.md
          cat CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: changelog
          path: CHANGELOG.md
          if-no-files-found: error

  build:
    name: Build Windows app
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.22.3 .

      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1 -Version $env:VERSION

      - name: Smoke test executable
        shell: pwsh
        run: |
          $p = Start-Process dist/MQTTBroker/MQTTBroker.exe -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          do {
            Start-Sleep -Seconds 1
            $p.Refresh()
          } until ($p.HasExited -or $p.MainWindowTitle -eq 'MQTT Broker' -or (Get-Date) -gt $deadline)
          $title = $p.MainWindowTitle
          $exited = $p.HasExited
          if (-not $exited) { Stop-Process -Id $p.Id -Force }
          if ($title -ne 'MQTT Broker') { throw "Main window not shown (title='$title', exited=$exited)" }
          Write-Output "Executable started and showed its main window"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: dist/MQTTBroker-v${{ needs.prepare.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  deploy:
    name: Deploy release
    needs: [prepare, changelog, build]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.zip \
            --title "MQTT Broker $TAG" \
            --notes-file release/CHANGELOG.md \
            --target "$GITHUB_SHA"
