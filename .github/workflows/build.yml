name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version label used in the package file names
        required: false
        default: dev
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # Oldest supported Ubuntu for the widest glibc compatibility
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.22.3 .

      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1 -Version $env:VERSION

      - name: Smoke test
        shell: pwsh
        run: ./packaging/smoke_test.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ runner.os }}
          path: |
            dist/MQTTBroker-v*.zip
            dist/MQTTBroker-v*.tar.gz
          if-no-files-found: error
